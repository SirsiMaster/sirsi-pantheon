<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ra — cloud board unavailable</title>
<style>
:root{color-scheme:dark;--bg:#0d1512;--ink:#e6efe9;--dim:#9fb3a9;--ok:#2bd29b;--warn:#cdad5a;--line:#22302a}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 16px}
h1{font-size:22px;margin:0 0 8px}p{color:var(--dim);margin:0 0 20px}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
li{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
a{color:var(--ok)}.st{color:var(--dim);font-size:14px}.st.ok{color:var(--ok)}.st.no{color:var(--warn)}
</style>
</head>
<body>
<main>
<h1>The cloud board is not answering</h1>
<p id="msg">Looking for a live Mac console on your tailnet…</p>
<ul id="macs"></ul>
<p class="st" style="margin-top:20px">This page retries the cloud board every 30 seconds and returns there when it is back. The ledger itself lives in the router service; if that is down too, every console will say so.</p>
</main>
<script>
(function(){
'use strict';
var list=document.getElementById('macs'),msg=document.getElementById('msg');
function probe(url){
 // no-cors: an opaque answer still proves the console is reachable.
 return fetch(url.replace(/\/$/,'')+'/healthz',{mode:'no-cors',cache:'no-store',signal:AbortSignal.timeout(4000)}).then(function(){return true},function(){return false});
}
function cloudBack(){
 fetch('/healthz',{cache:'no-store',signal:AbortSignal.timeout(4000)}).then(function(r){if(r.ok)location.replace('/')},function(){});
}
caches.match('/api/macs').then(function(r){return r?r.json():{macs:[]}}).then(function(d){
 var macs=(d&&d.macs)||[];
 if(!macs.length){msg.textContent='No Mac consoles are known to this device yet. Open the board once while it is up.';return}
 list.innerHTML=macs.map(function(m,i){return '<li><a href="'+m.url+'">'+m.name+'</a><span class="st" id="s'+i+'">checking…</span></li>'}).join('');
 var preferred=d.selected,done=false;
 Promise.all(macs.map(function(m,i){return probe(m.url).then(function(ok){
  var s=document.getElementById('s'+i);s.textContent=ok?'reachable':'not reachable';s.className='st '+(ok?'ok':'no');return ok})})).then(function(ok){
  var pick=-1;macs.forEach(function(m,i){if(ok[i]&&(pick<0||m.name===preferred))pick=i});
  if(pick<0){msg.textContent='No Mac console is reachable right now. Is this device on your tailnet?';return}
  done=true;msg.textContent='Opening '+macs[pick].name+'…';setTimeout(function(){location.href=macs[pick].url},800);
 });
});
setInterval(cloudBack,30000);
})();
</script>
</body>
</html>
