# goreleaser config — Sirsi Pantheon v0.19.0
# Docs: https://goreleaser.com
version: 2

project_name: sirsi-pantheon

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: sirsi
    main: ./cmd/sirsi/
    binary: sirsi
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    # windows dropped 2026-06-19: Mac-first (ADR-032, Win/Linux deferred). cmd/sirsi
    # uses POSIX-only syscalls (hapi SIGSTOP/kill, gemma flock/Setpgid) that don't
    # cross-compile to Windows; re-add with per-platform build tags when Windows ships.
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/SirsiMaster/sirsi-pantheon/internal/version.Version={{.Version}}
      - -X github.com/SirsiMaster/sirsi-pantheon/internal/version.Commit={{.ShortCommit}}
      - -X github.com/SirsiMaster/sirsi-pantheon/internal/version.Date={{.Date}}

  - id: sirsi-agent
    main: ./cmd/sirsi-agent/
    binary: sirsi-agent
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    # windows dropped 2026-06-19: Mac-first (ADR-032, Win/Linux deferred). cmd/sirsi
    # uses POSIX-only syscalls (hapi SIGSTOP/kill, gemma flock/Setpgid) that don't
    # cross-compile to Windows; re-add with per-platform build tags when Windows ships.
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/SirsiMaster/sirsi-pantheon/internal/version.Version={{.Version}}
      - -X github.com/SirsiMaster/sirsi-pantheon/internal/version.Commit={{.ShortCommit}}
      - -X github.com/SirsiMaster/sirsi-pantheon/internal/version.Date={{.Date}}

  # NOTE: the standalone deity binaries (sirsi-anubis/maat/thoth/scarab/guard)
  # were removed 2026-06-06 (chore/drop-redundant-deity-binaries). They were
  # redundant with `sirsi` subcommands — anubis/guard/maat/scarab were
  # help-only stubs and thoth was a subset of `sirsi thoth` — and added ~14 MB
  # to the release for zero unique functionality (ADR-005: Pantheon is the
  # product; deities are sub-systems reached via `sirsi <deity>`).

  # NOTE: sirsi-menubar requires CGO (systray) and cannot cross-compile.
  # It is macOS-only and built separately via `make dmg` or `scripts/build-dmg.sh`.
  # The DMG includes both sirsi-menubar and sirsi CLI in the Pantheon.app bundle.

archives:
  - id: default
    builds:
      - sirsi
      - sirsi-agent
    name_template: >-
      sirsi-pantheon_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
      - goos: linux
        format: tar.gz
      - goos: darwin
        format: tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - configs/default_rules.yaml
      - configs/example_policy.yaml
      - configs/workspace_template.yaml

nfpms:
  - id: sirsi-pantheon
    package_name: sirsi-pantheon
    vendor: Sirsi Technologies
    homepage: https://sirsi.ai/pantheon
    description: "Unified DevOps Intelligence Platform"
    license: MPL-2.0
    maintainer: Sirsi Technologies <engineering@sirsi.ai>
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin

brews:
  - name: sirsi-pantheon
    ids:
      - default
    repository:
      owner: SirsiMaster
      name: homebrew-tools
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/SirsiMaster/sirsi-pantheon
    description: "Unified DevOps Intelligence Platform — One Install, All Deities"
    license: Apache-2.0
    install: |
      bin.install "sirsi"
      bin.install "sirsi-agent"
    test: |
      system "#{bin}/sirsi", "version"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: SirsiMaster
    name: sirsi-pantheon
  name_template: "v{{.Version}}"
  prerelease: auto
  # macOS is Pantheon's product release surface. Keep the GitHub release
  # private until the signed, notarized DMG has been uploaded and bound to the
  # exact tag/tree; a CLI-only release must never become the public artifact.
  draft: true
  header: |
    ## Sirsi Pantheon {{.Version}}

    Infrastructure intelligence from one laptop to a fleet. 81 rules, zero config, zero telemetry.

    ---

    ### Download

    | Platform | Download | Notes |
    |----------|----------|-------|
    | **macOS (Apple Silicon)** | [`Pantheon.app` (DMG)](https://github.com/SirsiMaster/sirsi-pantheon/releases/download/v{{.Version}}/SirsiPantheon-{{.Version}}-arm64.dmg) | Menu bar + CLI. Intel Macs use Rosetta. |
    | **macOS / Linux (CLI)** | `brew tap SirsiMaster/tools && brew install sirsi-pantheon` | The `sirsi` CLI (all deities are `sirsi <deity>` subcommands). |
    | **Linux (deb)** | [`sirsi-pantheon_{{.Version}}_linux_amd64.deb`](https://github.com/SirsiMaster/sirsi-pantheon/releases/download/v{{.Version}}/sirsi-pantheon_{{.Version}}_linux_amd64.deb) | `sudo dpkg -i sirsi-pantheon_*.deb` |
    | **Linux (rpm)** | [`sirsi-pantheon_{{.Version}}_linux_amd64.rpm`](https://github.com/SirsiMaster/sirsi-pantheon/releases/download/v{{.Version}}/sirsi-pantheon_{{.Version}}_linux_amd64.rpm) | `sudo rpm -i sirsi-pantheon_*.rpm` |
    | **From source** | `go install github.com/SirsiMaster/sirsi-pantheon/cmd/sirsi@v{{.Version}}` | Requires Go 1.25+. |

    ### Quick Start
    ```bash
    sirsi scan       # Find waste (81 rules across 7 domains)
    sirsi doctor     # System health diagnostic
    sirsi ghosts     # Find remnants of uninstalled apps
    sirsi quickstart # Guided first scan with recommendations
    ```

    ### macOS Gatekeeper Note
    Pantheon.app is ad-hoc signed. On first launch, macOS may show "cannot be opened because the developer cannot be verified." Right-click the app → Open → Open. This only happens once. Notarized signing is coming with our Apple Developer enrollment.

  footer: |
    ---
    **2,251 tests across 36 packages. Zero telemetry. Apache 2.0 licensed.**

    [sirsi.ai/pantheon](https://sirsi.ai/pantheon) · [Documentation](https://github.com/SirsiMaster/sirsi-pantheon/blob/main/README.md) · [Changelog](https://github.com/SirsiMaster/sirsi-pantheon/blob/main/CHANGELOG.md)

    *Built by [Sirsi Technologies](https://sirsi.ai).*
