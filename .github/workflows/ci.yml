name: CI — Sirsi Pantheon

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Auto-cancel a branch's prior in-flight run so a superseded change never
# consumes hosted macOS capacity needed by the current revision.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install golangci-lint v2 (built with Go 1.25)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run --timeout=5m

      - name: ADR number uniqueness
        run: bash scripts/check-adr-numbers.sh

      # ADR-062 §1: the router ledger is opened only through routerstore.Resolve().
      # A direct open outside the package is a split-brain path once a node is on
      # the router service. --self-test first: a gate never shown red is untested.
      - name: router store direct-open gate (ADR-062)
        run: |
          bash scripts/check-router-store-open.sh --self-test
          bash scripts/check-router-store-open.sh

      # Structural invariant, not a style check: every user-visible font on the
      # menubar surface must route through the width-derived type scale. It runs
      # on the HOSTED runner because it needs no Xcode — a guard that only runs
      # manually does not prevent recurrence, and the self-hosted runners are
      # currently contended.
      - name: menubar font scaling (structural guard)
        run: ./macapp/check-font-scaling.sh

      # Gemma resolver guards run on the HOSTED runner (bash + python3 only, no
      # Xcode/MLX): they EXTRACT the real ranking + conf-write blocks from the
      # versioned resolver and assert against synthetic payloads, so a live
      # resolver change that breaks the empty-cache WEDGE or the candidate
      # ranking reddens CI here. On all PRs, unlike the self-hosted test job.
      - name: gemma resolver guards
        run: |
          bash scripts/gemma/model-resolver-ranking.test.sh
          bash scripts/gemma/model-resolver-cache.test.sh

  test:
    name: Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        shell: bash
        run: go test -v -race -short -coverprofile=coverage.out ./...
        env:
          CGO_ENABLED: 1

      # ADR-062 rs-07b: the same routerstore suite on PostgreSQL (the Ra backend),
      # plus pg/schema.sql structure/behaviour/least-privilege checks with their
      # negative controls. It skips loudly when initdb is unavailable.
      - name: Router store on PostgreSQL (ADR-062)
        run: bash scripts/ci-postgres.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      # ADR-057: ADR numbers are allocated through the router store, not by
      # counting files. Two documents claiming one number makes every citation
      # of it ambiguous. --allow is the pre-existing debt list (013/016/046/054
      # each have two documents today); NEW collisions fail the build, known
      # ones are reported. Only ever REMOVE numbers from that list.
      # SIRSI_ROUTER_DB points at a scratch store so CI never touches the live one.
      - name: ADR number collisions
        shell: bash
        env:
          SIRSI_ROUTER_DB: ${{ runner.temp }}/adr-audit/router.db
        run: |
          go build -o sirsi ./cmd/sirsi/
          ./sirsi adr audit --docs docs --allow 13,16,46,54

      # BEHAVIORAL guard — it BUILDS and RUNS the menubar binary, so unlike its
      # structural sibling (check-font-scaling.sh, hosted runner) it needs the
      # Swift toolchain and must live on this macOS job. The invariant is "a
      # command-line question gets a command-line answer": the process must
      # EXIT. app.run() blocks forever, so a launch and a correct exit are only
      # distinguishable by running it and watching whether it terminates.
      #
      # This runner is the owner's own machine. The guard copies the binary to a
      # non-matching name before running it, so a REGRESSED case (which does
      # launch) cannot retire the operator's live menubar by executable-name
      # match. A regression still costs a stray accessory process for up to 5s
      # before the timeout reaps it; that is the honest price of testing this.
      - name: menubar CLI flags (behavioral guard)
        run: ./macapp/check-cli-flags.sh

      - name: Ma'at Pulse — Dynamic Metrics
        shell: bash
        run: |
          go build -o sirsi ./cmd/sirsi/
          ./sirsi maat pulse --skip-test --json > metrics.json
          echo "=== Ma'at Pulse Metrics ==="
          cat metrics.json

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14]
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build sirsi
        run: go build -o sirsi${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/sirsi/

      - name: Build sirsi-agent
        run: go build -o sirsi-agent${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/sirsi-agent/
        env:
          CGO_ENABLED: '0'

      # Builds passing is not the same as the CLI working. Actually EXECUTE the
      # built binary on every OS: prove it runs, JSON marshals, and every core
      # command is registered + its help renders. Non-destructive only — no
      # clean/purge apply, only --help and read-only commands.
      - name: Runtime smoke (execute the built CLI per OS)
        shell: bash
        run: |
          set -euo pipefail
          BIN="./sirsi${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          echo "== runtime smoke: $BIN on ${{ runner.os }} =="
          "$BIN" version
          "$BIN" version --json >/dev/null
          "$BIN" --help >/dev/null
          for c in scan clean ghosts duplicates status setup diagnose audit fix network purge installer hardware risk surface tui router thread; do
            "$BIN" "$c" --help >/dev/null || { echo "::error::'$c --help' failed on ${{ runner.os }}"; exit 1; }
          done
          # Read-only real execution (setup --json is non-mutating). Non-fatal so
          # an OS-specific quirk warns rather than red-X the matrix.
          "$BIN" setup --json >/dev/null 2>&1 || echo "::warning::'setup --json' non-zero on ${{ runner.os }}"
          echo "✅ runtime smoke passed on ${{ runner.os }}"

      - name: Binary size guard (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          SIRSI_SIZE=$(stat -f%z sirsi 2>/dev/null || stat -c%s sirsi)
          AGENT_SIZE=$(stat -f%z sirsi-agent 2>/dev/null || stat -c%s sirsi-agent)
          echo "sirsi: ${SIRSI_SIZE} bytes"
          echo "sirsi-agent: ${AGENT_SIZE} bytes"
          if [ "$SIRSI_SIZE" -gt 26214400 ]; then
            echo "::warning::sirsi binary exceeds 25MB (${SIRSI_SIZE} bytes)"
          fi
          if [ "$AGENT_SIZE" -gt 12582912 ]; then
            echo "::warning::sirsi-agent binary exceeds 12MB (${AGENT_SIZE} bytes)"
          fi

      - name: Binary size guard (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $p_size = (Get-Item sirsi.exe).Length
          $a_size = (Get-Item sirsi-agent.exe).Length
          Write-Host "sirsi: $p_size bytes"
          Write-Host "sirsi-agent: $a_size bytes"
          if ($p_size -gt 26214400) { Write-Output "::warning::sirsi binary exceeds 25MB ($p_size bytes)" }
          if ($a_size -gt 12582912) { Write-Output "::warning::sirsi-agent binary exceeds 12MB ($a_size bytes)" }
