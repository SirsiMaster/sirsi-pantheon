name: CI — Sirsi Pantheon

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Auto-cancel a branch's prior in-flight run on every new push, so a
# rebase-heavy PR stack never leaves superseded runs starving the serialized
# self-hosted runners (root-caused 2026-07-24: 12 stale runs clogged 2 runners).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install golangci-lint v2 (built with Go 1.25)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run --timeout=5m

      # Structural invariant, not a style check: every user-visible font on the
      # menubar surface must route through the width-derived type scale. It runs
      # on the HOSTED runner because it needs no Xcode — a guard that only runs
      # manually does not prevent recurrence, and the self-hosted runners are
      # currently contended.
      - name: menubar font scaling (structural guard)
        run: ./macapp/check-font-scaling.sh

      # Gemma resolver guards run on the HOSTED runner (bash + python3 only, no
      # Xcode/MLX): they EXTRACT the real ranking + conf-write blocks from the
      # versioned resolver and assert against synthetic payloads, so a live
      # resolver change that breaks the empty-cache WEDGE or the candidate
      # ranking reddens CI here. On all PRs, unlike the self-hosted test job.
      - name: gemma resolver guards
        run: |
          bash scripts/gemma/model-resolver-ranking.test.sh
          bash scripts/gemma/model-resolver-cache.test.sh

  test:
    name: Test
    runs-on: [self-hosted, macOS, ARM64]  # M5 local frame (ADR-042)
    # ADR-042 fork guard: this repo is PUBLIC — never run fork-PR code on Sirsi hardware.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Decouple + heal the Go module cache (self-hosted)
        shell: bash
        run: |
          # Two m5 runners (m5-sirsi, m5-sirsi-2) share this box. A SINGLE
          # GOMODCACHE means concurrent `go test`/`go build` race on read-only
          # module files ("Can't unlink already-existing object: Permission
          # denied"), and one cache truncated mid-write (a memory/swap storm)
          # reddens EVERY self-hosted repo with a fake "SECURITY ERROR /
          # checksum mismatch". Give each runner its OWN persistent module tree
          # so they never collide, then sweep zero-byte artifacts — always
          # corrupt, always safely re-fetchable (content-addressed +
          # checksum-verified on re-download). Set before setup-go so
          # `go env GOMODCACHE` reports the override. Refs: items 150517, 172218.
          CACHE="$HOME/.cache/sirsi-ci/${RUNNER_NAME:-default}/gomodcache"
          mkdir -p "$CACHE/cache/download"
          echo "GOMODCACHE=$CACHE" >> "$GITHUB_ENV"
          find "$CACHE/cache/download" \( -name '*.mod' -o -name '*.zip' -o -name '*.info' -o -name '*.ziphash' \) -size 0 -print -delete 2>/dev/null || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # The step above already gives this runner a PERSISTENT, private
          # GOMODCACHE on local disk that survives between jobs. setup-go's
          # built-in cache would then archive → upload → download → extract
          # that same tree on every run: pure overhead on a self-hosted box,
          # and the restore/save pair is where both m5 runners were observed
          # parked for 17–20 min at 0% CPU (no sockets, no children, idle
          # event loop), pinning the whole 2-runner pool and stalling the
          # merge queue behind it. Hosted runners keep cache: true — there the
          # disk is ephemeral and the cache genuinely pays for itself.
          cache: false

      - name: Run tests
        shell: bash
        run: go test -v -race -short -coverprofile=coverage.out ./...
        env:
          CGO_ENABLED: 1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Ma'at Pulse — Dynamic Metrics
        shell: bash
        run: |
          go build -o sirsi ./cmd/sirsi/
          ./sirsi maat pulse --skip-test --json > metrics.json
          echo "=== Ma'at Pulse Metrics ==="
          cat metrics.json

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    # ADR-042 fork guard: this repo is PUBLIC — never run fork-PR code on Sirsi hardware.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        os: [[self-hosted, macOS, ARM64]]   # 100% Mac: CLI→Menubar→TUI→GUI first; Windows/Linux deferred 3-6mo (owner 2026-06-19)
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4

      - name: Decouple + heal the Go module cache (self-hosted)
        shell: bash
        run: |
          # Per-runner module tree (no cross-runner unlink race) + zero-byte
          # artifact sweep (self-heals a truncated cache before it reads as a
          # fake SECURITY ERROR). See the Test job for the full rationale.
          # Refs: items 150517, 172218.
          CACHE="$HOME/.cache/sirsi-ci/${RUNNER_NAME:-default}/gomodcache"
          mkdir -p "$CACHE/cache/download"
          echo "GOMODCACHE=$CACHE" >> "$GITHUB_ENV"
          find "$CACHE/cache/download" \( -name '*.mod' -o -name '*.zip' -o -name '*.info' -o -name '*.ziphash' \) -size 0 -print -delete 2>/dev/null || true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          # See the Test job: GOMODCACHE is already persistent + per-runner on
          # local disk, so setup-go's archive/extract cycle is overhead that
          # also serialises the two m5 runners against each other.
          cache: false

      - name: Build sirsi
        run: go build -o sirsi${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/sirsi/

      - name: Build sirsi-agent
        run: go build -o sirsi-agent${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/sirsi-agent/
        env:
          CGO_ENABLED: '0'

      # Builds passing is not the same as the CLI working. Actually EXECUTE the
      # built binary on every OS: prove it runs, JSON marshals, and every core
      # command is registered + its help renders. Non-destructive only — no
      # clean/purge apply, only --help and read-only commands.
      - name: Runtime smoke (execute the built CLI per OS)
        shell: bash
        run: |
          set -euo pipefail
          BIN="./sirsi${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          echo "== runtime smoke: $BIN on ${{ runner.os }} =="
          "$BIN" version
          "$BIN" version --json >/dev/null
          "$BIN" --help >/dev/null
          for c in scan clean ghosts duplicates status setup diagnose audit fix network purge installer hardware risk surface tui router thread; do
            "$BIN" "$c" --help >/dev/null || { echo "::error::'$c --help' failed on ${{ runner.os }}"; exit 1; }
          done
          # Read-only real execution (setup --json is non-mutating). Non-fatal so
          # an OS-specific quirk warns rather than red-X the matrix.
          "$BIN" setup --json >/dev/null 2>&1 || echo "::warning::'setup --json' non-zero on ${{ runner.os }}"
          echo "✅ runtime smoke passed on ${{ runner.os }}"

      - name: Binary size guard (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          SIRSI_SIZE=$(stat -f%z sirsi 2>/dev/null || stat -c%s sirsi)
          AGENT_SIZE=$(stat -f%z sirsi-agent 2>/dev/null || stat -c%s sirsi-agent)
          echo "sirsi: ${SIRSI_SIZE} bytes"
          echo "sirsi-agent: ${AGENT_SIZE} bytes"
          if [ "$SIRSI_SIZE" -gt 26214400 ]; then
            echo "::warning::sirsi binary exceeds 25MB (${SIRSI_SIZE} bytes)"
          fi
          if [ "$AGENT_SIZE" -gt 12582912 ]; then
            echo "::warning::sirsi-agent binary exceeds 12MB (${AGENT_SIZE} bytes)"
          fi

      - name: Binary size guard (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $p_size = (Get-Item sirsi.exe).Length
          $a_size = (Get-Item sirsi-agent.exe).Length
          Write-Host "sirsi: $p_size bytes"
          Write-Host "sirsi-agent: $a_size bytes"
          if ($p_size -gt 26214400) { Write-Output "::warning::sirsi binary exceeds 25MB ($p_size bytes)" }
          if ($a_size -gt 12582912) { Write-Output "::warning::sirsi-agent binary exceeds 12MB ($a_size bytes)" }
