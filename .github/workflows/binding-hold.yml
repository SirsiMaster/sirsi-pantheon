name: Binding Hold

# Compatibility status only. GitHub review state is not the authority for this
# repository; SSA/router disposition and normal CI are authoritative. This job
# deliberately never requires a second GitHub identity.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  binding-hold:
    name: binding-hold
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility status
        run: echo "GitHub review gate disabled; SSA/router disposition and normal CI remain authoritative."
