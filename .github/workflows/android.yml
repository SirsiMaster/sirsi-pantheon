name: Android CI

# Mac-first platform roadmap (ADR-032): Pantheon's GUI path is Mac desktop FROM
# the menubar, not mobile. This workflow is dormant — manual-only so it never
# auto-runs and burns CI. Restore the push/pull_request triggers if/when mobile
# returns to the roadmap (3–6mo, demand-gated).
on:
  workflow_dispatch:

jobs:
  build-aar:
    name: Build Go AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build AAR
        run: |
          mkdir -p bin/android
          gomobile bind -target=android -androidapi 21 -o bin/android/pantheon.aar ./mobile/

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pantheon-aar
          path: bin/android/pantheon.aar

  build-app:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: build-aar
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: pantheon-aar
          path: android/app/libs/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pantheon-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
