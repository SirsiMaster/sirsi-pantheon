name: Release — Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify Source for Native macOS Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify portable engine sources compile
        # This is source verification only. The commercial product is assembled,
        # signed, and published by the macOS job below as one Pantheon.app DMG
        # and PKG payload. Do not create a partial CLI release from this runner.
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./cmd/sirsi
          go build ./cmd/sirsi-agent

  menubar:
    name: Build Menu Bar (macOS DMG)
    runs-on: [self-hosted, macOS, ARM64]  # M5 local frame (ADR-042)
    needs: release
    # Fail fast instead of burning the 6h GitHub-Actions ceiling: if the signing
    # path wedges (a missing/invalid Developer-ID cert or app-specific password
    # makes `security import`/`codesign`/`notarytool --wait` hang), this caps the
    # job at 30m. A 5h20m hung DMG job (run 27873488895) is what motivated this.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Self-hosted — module cache already persists locally; setup-go's
          # archive/extract cycle is the ~20 min 0%-CPU stall. See ci.yml.
          cache: false

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          # `security find-identity build.keychain` can inspect the imported
          # certificate explicitly, but codesign searches the user's keychain
          # list. Keep the temporary keychain visible to every signing command.
          security list-keychains -d user -s build.keychain \
            "$HOME/Library/Keychains/login.keychain-db" \
            /Library/Keychains/System.keychain
          rm certificate.p12

      - name: Resolve imported Developer ID identity
        run: |
          set -euo pipefail
          test -f "$HOME/Library/Keychains/build.keychain-db" \
            || { echo "Temporary signing keychain was not created" >&2; exit 1; }
          ID=$(security find-identity -v -p codesigning build.keychain \
            | awk -F '"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$ID" ]; then
            echo "No Developer ID Application identity was imported into build.keychain" >&2
            exit 1
          fi
          echo "DEVELOPER_ID_APPLICATION=$ID" >> "$GITHUB_ENV"
          echo "Resolved the imported Developer ID Application identity for signing."

      - name: Preflight imported Developer ID Installer identity
        env:
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_INSTALLER:?DEVELOPER_ID_INSTALLER is required for the commercial Pantheon PKG}"
          case "$DEVELOPER_ID_INSTALLER" in
            "Developer ID Installer: "*"(9D382WV988)") ;;
            *)
              echo "DEVELOPER_ID_INSTALLER must name a Team 9D382WV988 Developer ID Installer identity" >&2
              exit 1
              ;;
          esac
          IMPORTED_INSTALLER="$(security find-identity -v build.keychain \
            | awk -F '\"' '/Developer ID Installer:.*\\(9D382WV988\\)/{print $2; exit}')"
          if [ -z "$IMPORTED_INSTALLER" ]; then
            echo "Temporary signing keychain does not contain a usable Team 9D382WV988 Developer ID Installer identity" >&2
            exit 1
          fi
          if [ "$IMPORTED_INSTALLER" != "$DEVELOPER_ID_INSTALLER" ]; then
            echo "Configured Developer ID Installer identity does not match the identity imported into the temporary signing keychain" >&2
            exit 1
          fi
          echo "Developer ID Installer identity preflight passed."

      - name: Build + sign + notarize DMG and PKG (arm64 — Intel Macs use Rosetta)
        env:
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_INSTALLER:?DEVELOPER_ID_INSTALLER is required for the commercial Pantheon PKG}"
          scripts/build-dmg.sh --release --version "$BUILD_VERSION" --arch arm64
          scripts/build-pkg.sh --release --version "$BUILD_VERSION" --arch arm64 --app Pantheon.app

      - name: Create or verify the exact GitHub release record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          EXPECTED_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if gh release view "$TAG_NAME" --repo SirsiMaster/sirsi-pantheon >/dev/null 2>&1; then
            ACTUAL_COMMIT="$(gh release view "$TAG_NAME" --repo SirsiMaster/sirsi-pantheon --json targetCommitish --jq '.targetCommitish')"
            [[ "$ACTUAL_COMMIT" == "$EXPECTED_COMMIT" ]] || {
              echo "existing release $TAG_NAME targets $ACTUAL_COMMIT, expected $EXPECTED_COMMIT" >&2
              exit 1
            }
          else
            gh release create "$TAG_NAME" \
              --repo SirsiMaster/sirsi-pantheon \
              --target "$EXPECTED_COMMIT" \
              --title "Sirsi Pantheon $BUILD_VERSION" \
              --generate-notes
          fi

      - name: Upload DMG and PKG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          test -f "bin/SirsiPantheon-${BUILD_VERSION}-arm64.dmg"
          test -f "bin/SirsiPantheon-${BUILD_VERSION}-arm64.pkg"
          gh release upload "$TAG_NAME" \
            "bin/SirsiPantheon-${BUILD_VERSION}-arm64.dmg" \
            "bin/SirsiPantheon-${BUILD_VERSION}-arm64.pkg"

      - name: Restore login keychain as default (always)
        if: always()
        run: |
          # 2026-09-27: this job runs on self-hosted macOS runners (m1-pantheon,
          # M5). The "Import signing certificate" step sets build.keychain as the
          # DEFAULT keychain and nothing restored it, so after every release the
          # runner's default stayed build.keychain — a temporary, locked keychain.
          # Any later process touching the default keychain (a watch loop, the git
          # credential helper, assistantd) then re-prompted endlessly for a locked
          # keychain on the developer's own Mac. Always restore the login keychain
          # as default and drop the temp keychain — on success, failure, or skip.
          LOGIN="$HOME/Library/Keychains/login.keychain-db"
          if [ -f "$LOGIN" ]; then
            security default-keychain -s "$LOGIN" 2>/dev/null || true
            security list-keychains -d user -s "$LOGIN" "/Library/Keychains/System.keychain" 2>/dev/null || true
          fi
          security delete-keychain build.keychain 2>/dev/null || true

  bump-cask:
    name: Publish canonical Homebrew Cask (DMG SHA256)
    runs-on: ubuntu-latest
    needs: menubar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download DMG and compute SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release download "$TAG_NAME" \
            --repo SirsiMaster/sirsi-pantheon \
            --pattern "SirsiPantheon-${VERSION}-arm64.dmg"
          SHA=$(sha256sum "SirsiPantheon-${VERSION}-arm64.dmg" | awk '{print $1}')
          echo "SHA256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Render and verify the canonical cask bytes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          SHA256: ${{ steps.sha.outputs.SHA256 }}
        run: |
          set -euo pipefail
          go run ./cmd/sirsi cask-release render \
            --version "$VERSION" --dmg-sha256 "$SHA256" > sirsi-pantheon.rb
          go run ./cmd/sirsi cask-release verify \
            --version "$VERSION" --dmg-sha256 "$SHA256" --file sirsi-pantheon.rb

      - name: Publish and read back Casks/sirsi-pantheon.rb in homebrew-tools
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          SHA256: ${{ steps.sha.outputs.SHA256 }}
        run: |
          set -euo pipefail
          CASK_PATH="Casks/sirsi-pantheon.rb"
          REPO="SirsiMaster/homebrew-tools"

          # Get current blob SHA (required for GitHub API file update)
          BLOB_SHA=$(gh api "repos/${REPO}/contents/${CASK_PATH}" --jq '.sha')
          CONTENT=$(base64 -w0 sirsi-pantheon.rb)

          gh api "repos/${REPO}/contents/${CASK_PATH}" \
            -X PUT \
            -f message="chore: bump cask to v${VERSION}" \
            -f content="${CONTENT}" \
            -f sha="${BLOB_SHA}"

          gh api "repos/${REPO}/contents/${CASK_PATH}" --jq '.content' | base64 --decode > published-cask.rb
          go run ./cmd/sirsi cask-release verify \
            --version "$VERSION" --dmg-sha256 "$SHA256" --file published-cask.rb

  publish-npm:
    name: Publish thoth-init to npm (OIDC)
    runs-on: ubuntu-latest
    needs: release
    # Non-fatal: thoth-init publishing 404'd (package not yet claimed / OIDC
    # trusted-publisher not configured), which failed the WHOLE release run and
    # masked the signed-DMG result. The npm tool is decoupled from the signed
    # macOS release, so a publish failure must not red the release.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # thoth-init is versioned INDEPENDENTLY of the pantheon release tag. The old
      # flow overrode its package.json version with the tag (e.g. 0.23.2-beta),
      # which would DOWNGRADE the npm `latest` tag (thoth-init is at 2.0.0) and
      # 404'd every release. Publish ONLY the version already in
      # tools/thoth-init/package.json, and only when it is genuinely new — an
      # unchanged thoth-init is a no-op, never a downgrade and never a failed
      # release. (A new version still needs the npm Trusted Publisher configured;
      # that is owner-gated.)
      - name: Publish thoth-init (skip if this version is already on npm)
        working-directory: tools/thoth-init
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p 'require("./package.json").name')"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} already published — nothing to publish."
            exit 0
          fi
          echo "Publishing ${PKG_NAME}@${PKG_VERSION} (provenance, public)..."
          npm publish --provenance --access public
