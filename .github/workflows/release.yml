name: Release — Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Release (CLI + Deities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/verify-release-source-identity.sh "$RELEASE_TAG"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests (skip CGO-dependent packages on Linux)
        env:
          CGO_ENABLED: "0"
        run: go test -short $(go list ./... | grep -v '/seba$\|/brain$\|/mcp$\|/ka$\|/tests/')

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  menubar:
    name: Build Menu Bar (macOS DMG)
    runs-on: [self-hosted, macOS, ARM64]  # M5 local frame (ADR-042)
    needs: release
    env:
      # Only non-sensitive presence booleans are job-scoped. Raw secret values
      # remain confined to the steps that import/materialize them.
      MACOS_CERTIFICATE_PRESENT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      ASC_KEY_CONTENT_PRESENT: ${{ secrets.ASC_KEY_CONTENT != '' }}
    # Fail fast instead of burning the 6h GitHub-Actions ceiling: if the signing
    # path wedges (a missing/invalid Developer-ID cert or app-specific password
    # makes `security import`/`codesign`/`notarytool --wait` hang), this caps the
    # job at 30m. A 5h20m hung DMG job (run 27873488895) is what motivated this.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/verify-release-source-identity.sh "$RELEASE_TAG"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Self-hosted — module cache already persists locally; setup-go's
          # archive/extract cycle is the ~20 min 0%-CPU stall. See ci.yml.
          cache: false

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_PRESENT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          rm certificate.p12

      - name: Verify canonical menubar release contract
        run: bash scripts/verify-menubar-release-contract.sh

      - name: Prepare App Store Connect notarization key
        if: env.ASC_KEY_CONTENT_PRESENT == 'true'
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_CONTENT" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build + sign + notarize DMG (arm64 — Intel Macs use Rosetta)
        env:
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          REQUIRE_RELEASE_SIGNING: "1"
          REQUIRE_RELEASE_NOTARIZATION: "1"
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/build-dmg.sh --version "$BUILD_VERSION" --arch arm64

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release upload "$TAG_NAME" \
            "bin/SirsiPantheon-${BUILD_VERSION}-arm64.dmg"

      # The menu bar app (fyne/systray) needs CGO+Cocoa and cannot be built by
      # the ubuntu goreleaser job, so the curl install.sh path has no menubar
      # binary. Build it here (native macOS = CGO works), sign it with the same
      # Developer-ID cert as the DMG so Full Disk Access grants persist across
      # updates, and upload a standalone archive install.sh fetches on darwin.
      - name: Build and upload standalone sirsi-menubar (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          mkdir -p dist/menubar
          GO_LDFLAGS="-s -w -X github.com/SirsiMaster/sirsi-pantheon/internal/version.Version=v${BUILD_VERSION}"
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags="$GO_LDFLAGS" \
            -o dist/menubar/sirsi-menubar ./cmd/sirsi-menubar/
          if [ -n "${DEVELOPER_ID_APPLICATION:-}" ]; then
            codesign --force --options runtime \
              --sign "$DEVELOPER_ID_APPLICATION" dist/menubar/sirsi-menubar
          else
            codesign --force --sign - dist/menubar/sirsi-menubar || true
          fi
          ARCHIVE="sirsi-menubar_${BUILD_VERSION}_darwin_arm64.tar.gz"
          tar -czf "$ARCHIVE" -C dist/menubar sirsi-menubar
          gh release upload "$TAG_NAME" "$ARCHIVE"

  windows-installer:
    name: Build Windows Installer
    # Mac-first platform roadmap (ADR-032): Windows is deferred 3–6mo, demand-gated.
    # Gated OFF so a tag release never fails on Windows; set the repo variable
    # ENABLE_WINDOWS_BUILD=true to re-enable when the platform phase arrives.
    if: ${{ vars.ENABLE_WINDOWS_BUILD == 'true' }}
    runs-on: windows-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/verify-release-source-identity.sh "$RELEASE_TAG"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install NSIS
        run: choco install nsis -y

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Windows binaries
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          GO_LDFLAGS="-s -w -X github.com/SirsiMaster/sirsi-pantheon/internal/version.Version=v${BUILD_VERSION}"
          mkdir -p bin/windows
          # Standalone deity binaries removed 2026-06-06 — redundant with `sirsi`
          # subcommands (see .goreleaser.yaml note). Ship sirsi + sirsi-agent only.
          for cmd in sirsi sirsi-agent; do
            CGO_ENABLED=0 go build -ldflags="$GO_LDFLAGS" -o "bin/windows/${cmd}.exe" "./cmd/${cmd}/"
          done

      - name: Build NSIS installer
        shell: cmd
        env:
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set "PATH=%PATH%;C:\Program Files (x86)\NSIS;C:\Program Files\NSIS"
          makensis /DVERSION=%BUILD_VERSION% scripts\windows-installer.nsi

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release upload "$TAG_NAME" \
            "bin/SirsiPantheon-${BUILD_VERSION}-windows-setup.exe"

  bump-cask:
    name: Bump Homebrew Cask (DMG SHA256)
    runs-on: ubuntu-latest
    needs: menubar
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download and bind uploaded DMG
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          gh release download "$TAG_NAME" \
            --repo SirsiMaster/sirsi-pantheon \
            --pattern "SirsiPantheon-${VERSION}-arm64.dmg"
          gh release view "$TAG_NAME" --repo SirsiMaster/sirsi-pantheon \
            --json tagName,targetCommitish,assets > release.json
          COMMIT=$(git rev-parse "${TAG_NAME}^{commit}")
          TREE=$(git rev-parse "${COMMIT}^{tree}")
          DMG="SirsiPantheon-${VERSION}-arm64.dmg"
          scripts/render-pantheon-homebrew-cask.sh \
            --tag "$TAG_NAME" --source-commit "$COMMIT" --source-tree "$TREE" \
            --dmg "$DMG" --release-json release.json --output rendered-cask.rb
          scripts/verify-pantheon-release-asset.sh \
            --tag "$TAG_NAME" --source-commit "$COMMIT" --source-tree "$TREE" \
            --dmg "$DMG" --release-json release.json --cask rendered-cask.rb

      - name: Update Casks/sirsi-pantheon.rb in homebrew-tools
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          CASK_PATH="Casks/sirsi-pantheon.rb"
          REPO="SirsiMaster/homebrew-tools"

          # Get current blob SHA (required for GitHub API file update)
          BLOB_SHA=$(gh api "repos/${REPO}/contents/${CASK_PATH}" --jq '.sha')

          # Content is rendered only after the release asset/tag/source chain is
          # proven above; this job cannot make a cask that references absent bytes.
          CONTENT=$(base64 -w0 rendered-cask.rb)

          gh api "repos/${REPO}/contents/${CASK_PATH}" \
            -X PUT \
            -f message="chore: bump cask to v${VERSION}" \
            -f content="${CONTENT}" \
            -f sha="${BLOB_SHA}"

  publish-npm:
    name: Publish thoth-init to npm (OIDC)
    runs-on: ubuntu-latest
    needs: release
    # Non-fatal: thoth-init publishing 404'd (package not yet claimed / OIDC
    # trusted-publisher not configured), which failed the WHOLE release run and
    # masked the signed-DMG result. The npm tool is decoupled from the signed
    # macOS release, so a publish failure must not red the release.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # thoth-init is versioned INDEPENDENTLY of the pantheon release tag. The old
      # flow overrode its package.json version with the tag (e.g. 0.23.2-beta),
      # which would DOWNGRADE the npm `latest` tag (thoth-init is at 2.0.0) and
      # 404'd every release. Publish ONLY the version already in
      # tools/thoth-init/package.json, and only when it is genuinely new — an
      # unchanged thoth-init is a no-op, never a downgrade and never a failed
      # release. (A new version still needs the npm Trusted Publisher configured;
      # that is owner-gated.)
      - name: Publish thoth-init (skip if this version is already on npm)
        working-directory: tools/thoth-init
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p 'require("./package.json").name')"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} already published — nothing to publish."
            exit 0
          fi
          echo "Publishing ${PKG_NAME}@${PKG_VERSION} (provenance, public)..."
          npm publish --provenance --access public
