name: Release — Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Release (CLI + Deities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify portable release binaries compile
        # This Ubuntu job must validate exactly the two CGO-free targets that
        # GoReleaser publishes. An all-package build also selects the macOS-only
        # webview and systray surfaces, making a Linux release fail before the
        # actual release build begins. The native app is built and verified by
        # the separate macOS menubar job below.
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./cmd/sirsi
          go build ./cmd/sirsi-agent

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  menubar:
    name: Build Menu Bar (macOS DMG)
    runs-on: [self-hosted, macOS, ARM64]  # M5 local frame (ADR-042)
    needs: release
    # Fail fast instead of burning the 6h GitHub-Actions ceiling: if the signing
    # path wedges (a missing/invalid Developer-ID cert or app-specific password
    # makes `security import`/`codesign`/`notarytool --wait` hang), this caps the
    # job at 30m. A 5h20m hung DMG job (run 27873488895) is what motivated this.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Self-hosted — module cache already persists locally; setup-go's
          # archive/extract cycle is the ~20 min 0%-CPU stall. See ci.yml.
          cache: false

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          rm certificate.p12

      - name: Build + sign + notarize DMG and PKG (arm64 — Intel Macs use Rosetta)
        env:
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          scripts/build-dmg.sh --release --version "$BUILD_VERSION" --arch arm64
          scripts/build-pkg.sh --release --version "$BUILD_VERSION" --arch arm64 --app Pantheon.app

      - name: Upload DMG and PKG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release upload "$TAG_NAME" \
            "bin/SirsiPantheon-${BUILD_VERSION}-arm64.dmg" \
            "bin/SirsiPantheon-${BUILD_VERSION}-arm64.pkg"

      # The native SwiftUI menu bar app is part of Pantheon.app.  This archive
      # serves terminal-first installs using the exact same native executable,
      # rather than rebuilding the retired Go/systray surface.
      - name: Build and upload standalone sirsi-menubar (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          mkdir -p dist/menubar
          (cd macapp && swift build -c release)
          cp macapp/.build/release/SirsiMenubar dist/menubar/sirsi-menubar
          if [ -n "${DEVELOPER_ID_APPLICATION:-}" ]; then
            codesign --force --options runtime \
              --sign "$DEVELOPER_ID_APPLICATION" dist/menubar/sirsi-menubar
          else
            codesign --force --sign - dist/menubar/sirsi-menubar || true
          fi
          ARCHIVE="sirsi-menubar_${BUILD_VERSION}_darwin_arm64.tar.gz"
          tar -czf "$ARCHIVE" -C dist/menubar sirsi-menubar
          gh release upload "$TAG_NAME" "$ARCHIVE"

      - name: Restore login keychain as default (always)
        if: always()
        run: |
          # 2026-09-27: this job runs on self-hosted macOS runners (m1-pantheon,
          # M5). The "Import signing certificate" step sets build.keychain as the
          # DEFAULT keychain and nothing restored it, so after every release the
          # runner's default stayed build.keychain — a temporary, locked keychain.
          # Any later process touching the default keychain (a watch loop, the git
          # credential helper, assistantd) then re-prompted endlessly for a locked
          # keychain on the developer's own Mac. Always restore the login keychain
          # as default and drop the temp keychain — on success, failure, or skip.
          LOGIN="$HOME/Library/Keychains/login.keychain-db"
          if [ -f "$LOGIN" ]; then
            security default-keychain -s "$LOGIN" 2>/dev/null || true
            security list-keychains -d user -s "$LOGIN" "/Library/Keychains/System.keychain" 2>/dev/null || true
          fi
          security delete-keychain build.keychain 2>/dev/null || true

  windows-installer:
    name: Build Windows Installer
    # Mac-first platform roadmap (ADR-032): Windows is deferred 3–6mo, demand-gated.
    # Gated OFF so a tag release never fails on Windows; set the repo variable
    # ENABLE_WINDOWS_BUILD=true to re-enable when the platform phase arrives.
    if: ${{ vars.ENABLE_WINDOWS_BUILD == 'true' }}
    runs-on: windows-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install NSIS
        run: choco install nsis -y

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Windows binaries
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          GO_LDFLAGS="-s -w -X github.com/SirsiMaster/sirsi-pantheon/internal/version.Version=v${BUILD_VERSION}"
          mkdir -p bin/windows
          # Standalone deity binaries removed 2026-06-06 — redundant with `sirsi`
          # subcommands (see .goreleaser.yaml note). Ship sirsi + sirsi-agent only.
          for cmd in sirsi sirsi-agent; do
            CGO_ENABLED=0 go build -ldflags="$GO_LDFLAGS" -o "bin/windows/${cmd}.exe" "./cmd/${cmd}/"
          done

      - name: Build NSIS installer
        shell: cmd
        env:
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set "PATH=%PATH%;C:\Program Files (x86)\NSIS;C:\Program Files\NSIS"
          makensis /DVERSION=%BUILD_VERSION% scripts\windows-installer.nsi

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          BUILD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release upload "$TAG_NAME" \
            "bin/SirsiPantheon-${BUILD_VERSION}-windows-setup.exe"

  bump-cask:
    name: Publish canonical Homebrew Cask (DMG SHA256)
    runs-on: ubuntu-latest
    needs: menubar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download DMG and compute SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release download "$TAG_NAME" \
            --repo SirsiMaster/sirsi-pantheon \
            --pattern "SirsiPantheon-${VERSION}-arm64.dmg"
          SHA=$(sha256sum "SirsiPantheon-${VERSION}-arm64.dmg" | awk '{print $1}')
          echo "SHA256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Render and verify the canonical cask bytes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          SHA256: ${{ steps.sha.outputs.SHA256 }}
        run: |
          set -euo pipefail
          go run ./cmd/sirsi cask-release render \
            --version "$VERSION" --dmg-sha256 "$SHA256" > sirsi-pantheon.rb
          go run ./cmd/sirsi cask-release verify \
            --version "$VERSION" --dmg-sha256 "$SHA256" --file sirsi-pantheon.rb

      - name: Publish and read back Casks/sirsi-pantheon.rb in homebrew-tools
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          SHA256: ${{ steps.sha.outputs.SHA256 }}
        run: |
          set -euo pipefail
          CASK_PATH="Casks/sirsi-pantheon.rb"
          REPO="SirsiMaster/homebrew-tools"

          # Get current blob SHA (required for GitHub API file update)
          BLOB_SHA=$(gh api "repos/${REPO}/contents/${CASK_PATH}" --jq '.sha')
          CONTENT=$(base64 -w0 sirsi-pantheon.rb)

          gh api "repos/${REPO}/contents/${CASK_PATH}" \
            -X PUT \
            -f message="chore: bump cask to v${VERSION}" \
            -f content="${CONTENT}" \
            -f sha="${BLOB_SHA}"

          gh api "repos/${REPO}/contents/${CASK_PATH}" --jq '.content' | base64 --decode > published-cask.rb
          go run ./cmd/sirsi cask-release verify \
            --version "$VERSION" --dmg-sha256 "$SHA256" --file published-cask.rb

  publish-npm:
    name: Publish thoth-init to npm (OIDC)
    runs-on: ubuntu-latest
    needs: release
    # Non-fatal: thoth-init publishing 404'd (package not yet claimed / OIDC
    # trusted-publisher not configured), which failed the WHOLE release run and
    # masked the signed-DMG result. The npm tool is decoupled from the signed
    # macOS release, so a publish failure must not red the release.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # thoth-init is versioned INDEPENDENTLY of the pantheon release tag. The old
      # flow overrode its package.json version with the tag (e.g. 0.23.2-beta),
      # which would DOWNGRADE the npm `latest` tag (thoth-init is at 2.0.0) and
      # 404'd every release. Publish ONLY the version already in
      # tools/thoth-init/package.json, and only when it is genuinely new — an
      # unchanged thoth-init is a no-op, never a downgrade and never a failed
      # release. (A new version still needs the npm Trusted Publisher configured;
      # that is owner-gated.)
      - name: Publish thoth-init (skip if this version is already on npm)
        working-directory: tools/thoth-init
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p 'require("./package.json").name')"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} already published — nothing to publish."
            exit 0
          fi
          echo "Publishing ${PKG_NAME}@${PKG_VERSION} (provenance, public)..."
          npm publish --provenance --access public
