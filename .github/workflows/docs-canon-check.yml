name: Docs Canon Check

# Lightweight counterpart to ci.yml's paths-ignore on docs/**, **/*.md, .thoth/**.
# Those paths include PANTHEON_RULES.md, CLAUDE.md, GEMINI.md and ADR-INDEX.md —
# exactly what internal/canon and the ADR number check read — so excluding them
# from the full CI run must not also blind the repo to canon drift. This job
# runs the two checks that matter on a docs-only change and skips the rest
# (Lint/Test/Build), which cannot be affected by a docs-only diff.

on:
  push:
    branches: [main, develop]
    paths: ['docs/**', '**/*.md', '.thoth/**']
  pull_request:
    branches: [main, develop]
    paths: ['docs/**', '**/*.md', '.thoth/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Classify complete changed-path set
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classifier positive and mixed-code negative controls
        run: python3 -B -m unittest discover -s scripts -p test_ci_docs_only.py -v
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_PR" = true ]; then
            value=$(git diff --name-only -z "$BASE...$HEAD" | python3 -B scripts/ci-docs-only.py)
          else
            value=$(git diff --name-only -z "$BASE" "$HEAD" | python3 -B scripts/ci-docs-only.py)
          fi
          echo "docs_only=$value" >> "$GITHUB_OUTPUT"
  docs-canon-check:
    name: Canon + ADR-INDEX guard
    # ubuntu-latest, not the owned M5 frame: owned frames are the default
    # (owner doctrine 2026-07-22), but Lint already runs hosted, linux minutes
    # bill 1x, and this keeps the serialized self-hosted runner free for Test/Build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Canon sync (PANTHEON_RULES vs CLAUDE.md/GEMINI.md)
        run: bash scripts/ci-private-sdk.sh go test ./internal/canon/...
        env:
          APOLLO_CI_INFERENCE_READ_KEY: ${{ secrets.APOLLO_CI_INFERENCE_READ_KEY }}
          APOLLO_CI_MERCURY_READ_KEY: ${{ secrets.APOLLO_CI_MERCURY_READ_KEY }}
          CI_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CI_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}

      - name: ADR number uniqueness + index high-water mark
        run: bash scripts/check-adr-numbers.sh

  # ci.yml paths-ignores this same docs/**, **/*.md, .thoth/** set, so a
  # docs-only PR never produces Lint/Test/Build — but main's branch protection
  # requires those three names by name, so GitHub holds a docs-only PR at
  # "Expected — waiting for status to be reported" forever. These stubs report
  # success under the exact required names on docs-only changes; on a code PR
  # this workflow's path filter doesn't trigger, so ci.yml's real jobs report
  # instead. GitHub's paths filter means ANY matching path, not ONLY matching
  # paths: mixed code+docs also triggers this workflow. Classify the complete
  # diff and give inapplicable stubs DIFFERENT names, so even a skipped stub
  # cannot mask the real in-progress Test/Lint/Build checks.
  Lint:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    name: ${{ needs.scope.outputs.docs_only == 'true' && 'Lint' || 'Docs-only lint exemption (not applicable)' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — heavy job not applicable (see ci.yml paths-ignore)"

  Test:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    name: ${{ needs.scope.outputs.docs_only == 'true' && 'Test' || 'Docs-only test exemption (not applicable)' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — heavy job not applicable (see ci.yml paths-ignore)"

  Build:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    name: ${{ needs.scope.outputs.docs_only == 'true' && 'Build (self-hosted, macOS, ARM64, 1.25)' || 'Docs-only build exemption (not applicable)' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — heavy job not applicable (see ci.yml paths-ignore)"
